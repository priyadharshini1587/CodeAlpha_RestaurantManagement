{% extends "base.html" %}
{% block title %}{{ 'Edit' if item else 'Add' }} Menu Item | Willow &amp; Thyme{% endblock %}
{% block content %}

<div class="page-header">
    <div>
        <h1>{{ 'Edit' if item else 'Add' }} Menu Item</h1>
        <p class="subtitle">{{ 'Update the details of this dish' if item else 'Add a new dish to the menu' }}</p>
    </div>
</div>

<div class="form-card">
    <form method="POST">
        <div class="form-group">
            <label for="name">Item Name</label>
            <input type="text" id="name" name="name" placeholder="e.g. Margherita Pizza"
                   value="{{ item.name if item else '' }}" required>
        </div>

        <div class="form-group">
            <label for="category">Category</label>
            <input type="text" id="category" name="category" placeholder="e.g. Main Course, Starters, Desserts"
                   value="{{ item.category if item else '' }}" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="price">Price (₹)</label>
                <input type="number" step="0.01" min="0" id="price" name="price"
                       value="{{ item.price if item else '' }}" required>
            </div>
            <div class="form-group">
                <label for="quantity">Available Quantity</label>
                <input type="number" min="0" id="quantity" name="quantity"
                       value="{{ item.quantity if item else '' }}" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">
            {{ 'Save Changes' if item else 'Add Menu Item' }}
        </button>
        <a href="{{ url_for('menu') }}" class="btn btn-secondary btn-block" style="margin-top: 10px;">Cancel</a>
    </form>
</div>

{% endblock %}
