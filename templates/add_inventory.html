{% extends "base.html" %}
{% block title %}Add Inventory | Willow &amp; Thyme{% endblock %}
{% block content %}

<div class="page-header">
    <div>
        <h1>Add Inventory</h1>
        <p class="subtitle">Register a new ingredient or top up existing stock</p>
    </div>
</div>

<div class="form-card">
    <form method="POST">
        <div class="form-group">
            <label for="ingredient_name">Ingredient Name</label>
            <input type="text" id="ingredient_name" name="ingredient_name" placeholder="e.g. Tomatoes" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="quantity">Quantity</label>
                <input type="number" step="0.1" min="0" id="quantity" name="quantity" placeholder="e.g. 10" required>
            </div>
            <div class="form-group">
                <label for="unit">Unit</label>
                <input type="text" id="unit" name="unit" placeholder="kg, litres, pcs..." value="units">
            </div>
        </div>

        <div class="form-group">
            <label for="low_stock_threshold">Low Stock Alert Threshold</label>
            <input type="number" step="0.1" min="0" id="low_stock_threshold" name="low_stock_threshold" value="5">
        </div>

        <button type="submit" class="btn btn-primary btn-block">Save Ingredient</button>
        <a href="{{ url_for('inventory') }}" class="btn btn-secondary btn-block" style="margin-top: 10px;">Cancel</a>
    </form>
</div>

{% endblock %}
